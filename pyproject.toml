[project]
name = "multicut-compression"
version = "0.1.0"
description = "Multi-Cut Image Compression Pipeline"
readme = "../docs/quick_start_guide.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "networkx>=2.6",
    "matplotlib>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["multicut_compression"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

